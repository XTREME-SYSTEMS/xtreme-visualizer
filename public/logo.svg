<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFED00"/>
      <stop offset="0.5" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#D4A800"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Diamond/floor icon -->
  <g filter="url(#goldGlow)">
    <path d="M24 60 L52 32 L80 60 L52 88 Z" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <path d="M24 60 L52 60 L80 60" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
    <path d="M52 32 L52 88" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
    <path d="M34 50 L52 42 L70 50 L52 58 Z" fill="url(#goldGrad)" opacity="0.25"/>
  </g>

  <!-- XTREME text -->
  <text x="96" y="58" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)" letter-spacing="2" filter="url(#goldGlow)">XTREME</text>

  <!-- FLOOR VISUALIZER subtitle -->
  <text x="98" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#FFD700" letter-spacing="6">FLOOR VISUALIZER</text>
</svg>
