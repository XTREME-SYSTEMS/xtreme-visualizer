# CI Workflow — DRAFT ARTIFACT
# The Base44 platform blocks writing to .github/workflows/.
# To activate CI, manually create this file in your GitHub repo at:
#   .github/workflows/ci.yml
# and paste the content below.
#
# Mandatory gates: lint → typecheck → test → build → audit
# E2E gate: Playwright with webServer lifecycle (no manual server management)
# A failing E2E job makes CI red — no continue-on-error.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint + Typecheck + Test + Build + Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Playwright E2E (desktop + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
            e2e/visual.spec.ts-snapshots/