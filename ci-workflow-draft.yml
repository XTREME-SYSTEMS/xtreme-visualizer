# CI Workflow — DRAFT ARTIFACT
# The Base44 platform blocks writing to .github/workflows/.
# To activate CI, manually create this file in your GitHub repo at:
#   .github/workflows/ci.yml
# and paste the content below.
#
# Mandatory gates: lint → typecheck → test → build → audit → e2e
# A failing E2E job makes CI red — NO continue-on-error.
# Browser installation failure makes CI red — NO continue-on-error.
#
# OPERATOR ACTION REQUIRED:
#   1. Create .github/workflows/ci.yml in the GitHub repo
#   2. Enable branch protection on main (require CI checks)
#   3. Require branches up to date before merge

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint + Typecheck + Test + Build + Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Playwright E2E (desktop + mobile)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Record Playwright version
        run: npx playwright --version
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Record Chromium version
        run: npx playwright install --dry-run chromium 2>&1 | head -5 || true
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
            e2e/visual.spec.ts-snapshots/